<style>
  /* Regras restauradas em 05/10/2026: tinham sido apagadas por engano no commit 2982a35 (02/10).
     Ficam antes das regras atuais, que prevalecem quando há conflito. */
  .rr-warn{font-size:11px;color:#9a3412;background:#fff7ed;border:1px solid #fed7aa;border-radius:6px;padding:4px 8px;margin:4px 0 10px;}
  .rr-loc b{font-size:13px;}
  .rr-loc .rr-trecho{display:block;color:#334155;}
  .rr-loc .rr-meta{display:block;font-size:11px;color:#64748b;margin-top:2px;}
  .rr-hero{display:flex;align-items:center;gap:12px;margin:12px 0 10px;padding:10px 12px;border-radius:10px;background:#f8fafc;border:1px solid #e2e8f0;}
  .rr-idx{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1;min-width:84px;}
  .rr-idx small{display:block;font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#64748b;margin-top:4px;}
  .rr-rank{font-size:13px;font-weight:700;}
  .rr-pill{display:inline-block;margin-top:4px;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;}
  .rr-pill.alto{background:#fee2e2;color:#991b1b;}
  .rr-pill.baixo{background:#dcfce7;color:#166534;}
  .rr-pill.sem{background:#e5e7eb;color:#374151;}
  .rr-eq{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:center;text-align:center;gap:4px;margin-bottom:12px;}
  .rr-eq .rr-box{background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:6px 4px;}
  .rr-eq .rr-box b{display:block;font-size:15px;}
  .rr-eq .rr-box span{font-size:10px;color:#64748b;text-transform:uppercase;letter-spacing:.04em;}
  .rr-eq .rr-op{color:#94a3b8;font-weight:700;}
  .rr-sec{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#64748b;margin:10px 0 6px;}
  .rr-bar{display:grid;grid-template-columns:110px 1fr 34px;align-items:center;gap:8px;margin:4px 0;}
  .rr-bar .rr-track{height:8px;background:#f1f5f9;border-radius:999px;overflow:hidden;}
  .rr-bar .rr-fill{height:100%;border-radius:999px;}
  .rr-bar b{text-align:right;}
  .rr-crit{margin:6px 0;}
  .rr-crit > span{font-size:11px;font-weight:600;color:#475569;}
  .rr-chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px;}
  .rr-chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:6px;padding:2px 3px 2px 7px;}
  .rr-chip i{font-style:normal;font-weight:700;min-width:18px;text-align:center;border-radius:4px;padding:1px 4px;}
  .rr-foot{margin-top:12px;padding-top:8px;border-top:1px solid #e2e8f0;font-size:11px;color:#64748b;}
  .rr-foot a{font-weight:600;}
  .pp{font-family:inherit;font-size:12.5px;color:#1f2937;display:flex;flex-direction:column;gap:10px;padding:2px 0;}
  .pp-head{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
  .pp-sub{font-size:11.5px;color:#6b7280;}
  .pp-sec{border-top:1px solid #e5e7eb;padding-top:8px;display:flex;flex-direction:column;gap:5px;}
  .pp-sec-t{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#9ca3af;}
  .pp-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;}
  .pp-k{font-size:10.5px;color:#9ca3af;display:block;}
  .pp-v{font-size:12.5px;font-weight:600;color:#1f2937;}
  .pp-desc{font-size:12px;line-height:1.45;color:#374151;}
  .pp-actions{display:flex;gap:6px;flex-wrap:wrap;padding-top:2px;}
  .pp-btn{font-size:11.5px;font-weight:700;color:#0f6e5e;background:#e3f3ef;border:none;border-radius:6px;padding:5px 10px;cursor:pointer;font-family:inherit;}
  .pp-btn.off{color:#9ca3af;background:#f3f4f6;cursor:default;}
  .pp .pbar-track{background:#e5e7eb;}
  .sv-modal{display:none;position:fixed;inset:0;z-index:100;background:rgba(15,23,42,.55);align-items:center;justify-content:center;padding:24px;}
  .sv-modal.open{display:flex;}
  .sv-modal-inner{background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow-lg);
    width:min(900px,92vw);height:min(560px,80vh);display:flex;flex-direction:column;overflow:hidden;}
  .sv-modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:10px 14px;border-bottom:1px solid var(--border);font-weight:700;font-size:13px;color:var(--text);}
  .sv-external{font-size:12px;font-weight:600;color:var(--accent);text-decoration:none;white-space:nowrap;}
  .sv-external:hover{text-decoration:underline;}
  .sv-close{border:none;background:none;font-size:16px;color:var(--text-dim);cursor:pointer;padding:2px 8px;border-radius:6px;line-height:1;}
  .sv-close:hover{background:var(--bg);color:var(--text);}
  .sv-modal-inner iframe{flex:1 1 auto;border:none;width:100%;}
  /* Ranking dos pontos críticos (29/10/2026): mesmo modal do Street View, mais largo */
  .pc-ranking{border:1px solid rgba(8,105,166,.35);background:rgba(255,255,255,.7);color:#0869A6;font:inherit;font-size:11px;
              font-weight:700;border-radius:6px;padding:2px 8px;cursor:pointer;white-space:nowrap;}
  .pc-ranking:hover{background:#fff;}
  .list-panel-header .pc-ranking{margin-left:auto;}
  .list-panel-header .pc-ranking + .pc-recolher{margin-left:0;}
  .rk-modal-inner{width:min(1200px,96vw);height:min(720px,90vh);}
  .rk-acoes{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end;}
  .rk-acoes button:not(.sv-close){border:1px solid var(--border-strong);background:var(--panel);color:var(--text);font:inherit;
              font-size:12px;font-weight:600;border-radius:6px;padding:5px 10px;cursor:pointer;white-space:nowrap;}
  .rk-acoes button:not(.sv-close):hover{border-color:#0869A6;color:#0869A6;}
  .rk-acoes button:disabled{opacity:.5;cursor:default;}
  .rk-status{font-size:11.5px;font-weight:600;color:#0869A6;}
  .rk-aviso{font-size:11.5px;color:var(--text-dim);padding:8px 14px;border-bottom:1px solid var(--border);}
  .rk-aviso:empty{display:none;}
  .rk-corpo{flex:1 1 auto;overflow:auto;}
  .rk-tab{border-collapse:separate;border-spacing:0;width:100%;font-size:12px;}
  .rk-tab th{position:sticky;top:0;background:var(--bg);text-align:left;font-size:11px;color:var(--text-dim);font-weight:700;
             padding:7px 8px;border-bottom:1px solid var(--border-strong);white-space:nowrap;}
  .rk-tab td{padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:top;}
  .rk-tab tbody tr:hover td{background:rgba(8,105,166,.05);}
  .rk-tab .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .rk-tab .rk-largo{min-width:220px;}
  .rk-tab .rk-nowrap{white-space:nowrap;}
  .rk-cor{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px;}
  .empty-state{flex:1 1 auto;color:var(--text-faint);font-size:12.5px;padding:10px 4px;}
  .map-source-toggle{
    display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin-top:10px;
    background:var(--bg);border:1px solid var(--border-strong);border-radius:8px;
    padding:0 12px;height:30px;font-family:inherit;font-size:12px;font-weight:700;color:var(--text-dim);
    cursor:pointer;white-space:nowrap;
  }
  .bm-seg{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--border-strong);border-radius:8px;overflow:hidden;}
  .bm-seg button{border:none;background:var(--panel);font-family:inherit;font-size:11px;font-weight:700;color:var(--text-dim);padding:6px 4px;cursor:pointer;}
  .bm-seg button + button{border-left:1px solid var(--border);}
  .bm-seg button.on{background:var(--accent);color:#fff;}
  .bm-seg button:not(.on):hover{background:var(--bg);color:var(--text);}
  .map-tools-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .map-tools-head h4{margin:0;}
  .map-source-toggle:hover{color:var(--text);border-color:var(--accent);}
  .google-map-frame{position:absolute;inset:0;width:100%;height:100%;border:none;display:none;z-index:5;}
  .google-map-missing-key{
    display:none;position:absolute;inset:0;z-index:5;
    background:var(--bg);flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:32px;gap:10px;
  }
  .google-map-missing-key h3{margin:0;font-size:15px;color:var(--text);}
  .google-map-missing-key p{margin:0;font-size:13px;color:var(--text-dim);max-width:420px;line-height:1.6;}
  .google-map-missing-key a{color:var(--accent);font-weight:700;text-decoration:none;}
  .google-map-missing-key a:hover{text-decoration:underline;}
  .google-map-missing-key code{background:var(--panel);border:1px solid var(--border);border-radius:5px;padding:1px 6px;font-size:12px;}
  .map-br-stack{position:absolute;right:calc(20px + var(--pc-lista-w));bottom:16px;display:flex;flex-direction:column;align-items:flex-end;gap:10px;z-index:15;}
  .map-center-controls{position:absolute;right:calc(20px + var(--pc-lista-w));top:50%;transform:translateY(-50%);display:flex;flex-direction:column;
    background:var(--panel);border:1px solid var(--border);border-radius:7px;box-shadow:var(--shadow);overflow:hidden;z-index:15;}
  .map-center-controls button{width:34px;height:34px;border:none;background:transparent;color:var(--text-dim);font-size:17px;
    font-family:inherit;cursor:pointer;line-height:1;}
  .map-center-controls button+button{border-top:1px solid var(--border);}
  .map-center-controls .ctrl-sep{height:0;border-top:1px solid var(--border);}
  .map-center-controls button:hover{background:var(--bg);color:var(--text);}
  /* Controles do mapa: voltaram à vertical em 16/10/2026 (pedido de Pedro), no meio da direita do mapa. */
  .legend{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-lg);padding:12px 14px;min-width:210px;}
  .legend h4{margin:0 0 8px;font-size:10.5px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:.05em;}
  .legend-row{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--text);padding:3px 0;}
  .legend-swatch{flex:0 0 auto;}
  .layer-row{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--text);padding:4px 0;cursor:pointer;}
  .layer-row input{margin:0;flex:none;accent-color:var(--accent);width:13px;height:13px;}
  .layer-swatch{flex:none;display:inline-flex;align-items:center;justify-content:center;}
  .data-info{position:relative;}
  .data-info-icon{
    display:flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;
    background:var(--panel);border:1px solid var(--border-strong);color:var(--text-dim);
    font-size:13px;font-weight:700;font-style:normal;cursor:default;box-shadow:var(--shadow);
  }
  .data-info-tip{
    position:absolute;bottom:30px;right:0;width:250px;
    background:#fff7ed;border:1px solid #fdba74;color:#9a3412;
    font-size:11px;font-weight:600;line-height:1.45;padding:8px 10px;border-radius:8px;
    box-shadow:var(--shadow-lg);opacity:0;visibility:hidden;transform:translateY(4px);
    transition:opacity .15s, transform .15s;pointer-events:none;
  }
  .data-info:hover .data-info-tip, .data-info:focus-within .data-info-tip{opacity:1;visibility:visible;transform:translateY(0);}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:4px;}
  ::-webkit-scrollbar-track{background:transparent;}
  .page-scroll{height:100%;overflow-y:auto;padding:18px 22px 40px;}
  .p2-kpirow{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:14px;}
  .p2-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:16px 18px;margin-bottom:14px;}
  .p2-card h3{margin:0 0 2px;font-size:14px;font-weight:700;}
  .p2-card .p2-sub{font-size:11.5px;color:var(--text-dim);margin-bottom:12px;}
  .ring-kpi{display:flex;align-items:center;gap:14px;}
  .ring-kpi .txt .lbl{font-size:10.5px;font-weight:700;color:var(--text-faint);text-transform:uppercase;letter-spacing:.04em;}
  .ring-kpi .txt .val{font-size:22px;font-weight:700;}
  .ring-kpi .txt .stlabel{font-size:11.5px;font-weight:700;display:flex;align-items:center;gap:5px;margin-top:2px;}
  .barkpi .val{font-size:22px;font-weight:700;margin-bottom:6px;}
  .barkpi .track{height:8px;border-radius:100px;background:#eef1f4;overflow:hidden;}
  .barkpi .fill{height:100%;background:var(--accent);}
  .curve-legend{display:flex;gap:16px;font-size:12px;color:var(--text-dim);margin-top:8px;flex-wrap:wrap;}
  .curve-legend .it{display:flex;align-items:center;gap:6px;}
  .sw-line{width:16px;height:0;border-top:2.5px solid;display:inline-block;}
  .sw-line.dashed{border-top-style:dashed;}
  .sw-dot{width:9px;height:9px;border-radius:50%;display:inline-block;}
  table.contracts{width:100%;border-collapse:collapse;font-size:12.5px;}
  table.contracts th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-faint);
    font-weight:700;padding:0 10px 8px;border-bottom:1px solid var(--border-strong);white-space:nowrap;cursor:pointer;}
  table.contracts th:hover{color:var(--text);}
  table.contracts td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:middle;white-space:nowrap;}
  table.contracts tbody tr{cursor:pointer;}
  table.contracts tbody tr:hover{background:var(--bg);}
  .bacia-tag{display:inline-flex;align-items:center;gap:6px;}
  .bacia-tag i{width:8px;height:8px;border-radius:50%;flex:none;}
  .mini-bar{width:52px;height:6px;border-radius:100px;background:#eef1f4;overflow:hidden;display:inline-block;vertical-align:middle;margin-right:6px;}
  .mini-bar span{display:block;height:100%;background:var(--accent);}
  .table-scroll{overflow-x:auto;}
  .p3-crumbrow{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .btn-back{font-size:12.5px;font-weight:700;color:var(--text-dim);background:var(--panel);border:1px solid var(--border-strong);
    border-radius:8px;padding:6px 10px;cursor:pointer;}
  .btn-back:hover{color:var(--text);}
  .crumbs{font-size:13px;color:var(--text-dim);}
  .crumbs b{color:var(--text);}
  .crumbs .sep{color:var(--text-faint);margin:0 5px;}

  .p3-head h2{font-size:20px;margin:0;}
  .p3-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:14px;}
  .idlist{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px;}
  .idlist .it .l{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-faint);margin-bottom:2px;font-weight:700;}
  .idlist .it .v{font-size:13.5px;color:var(--text);}
  .timeline{display:flex;flex-direction:column;gap:12px;margin-top:6px;}
  .tl-row{display:grid;grid-template-columns:170px 1fr 46px;align-items:center;gap:10px;}
  .tl-row .lbl{font-size:12.5px;color:var(--text-dim);}
  .tl-track{height:13px;border-radius:7px;background:#eef1f4;overflow:hidden;}
  .tl-fill{height:100%;}
  .tl-pct{font-size:11.5px;text-align:right;color:var(--text-dim);}
  .entraves-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0;}
  .entrave-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;}
  .entrave-card .eh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:8px;}
  .entrave-card h4{margin:0;font-size:13px;}
  .entrave-card p{font-size:12px;color:var(--text-dim);margin:0;line-height:1.5;}
  .siblings-list{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
  .sib-chip{display:flex;align-items:center;gap:7px;border:1px solid var(--border-strong);border-radius:100px;
    padding:5px 11px 5px 7px;background:var(--panel);cursor:pointer;font-size:12px;color:var(--text);}
  .sib-chip:hover{border-color:var(--accent);}
  .sib-chip i{width:8px;height:8px;border-radius:50%;}
  .status-pill.neutro{background:var(--neutro-bg);color:var(--text-dim);}
  .f-head{padding:18px 20px;}
  .f-head-top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:14px;}
  .f-code{font-size:11px;font-weight:700;color:var(--text-faint);letter-spacing:.05em;font-variant-numeric:tabular-nums;}
  .f-title{font-size:20px;margin:2px 0 4px;line-height:1.25;}
  .f-loc{font-size:12.5px;color:var(--text-dim);}
  .f-loc b{color:var(--text);font-weight:600;}
  .f-head-actions{display:flex;align-items:center;gap:10px;}
  .f-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
  .f-kpi{border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0;}
  .f-kpi .k{font-size:10px;font-weight:700;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em;}
  .f-kpi .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15;}
  .f-kpi .v small{font-size:11.5px;font-weight:600;color:var(--text-dim);}
  .f-kpi .s{font-size:11.5px;color:var(--text-dim);}
  .f-kpi .s b{color:var(--text);font-weight:600;}
  .f-bar{position:relative;height:8px;border-radius:100px;background:#eef1f4;overflow:visible;}
  .f-bar .fill{height:100%;border-radius:100px;background:var(--accent);}
  .f-bar .mark{position:absolute;top:-3px;width:2px;height:14px;background:var(--text);border-radius:1px;}
  .f-lbl{font-size:10px;font-weight:700;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;}
  .f-escopo{margin:8px 0 16px;}
  .f-escopo p{margin:0;font-size:13px;color:var(--text-dim);line-height:1.6;}
  .f-cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
  .f-cols2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}

  .f-dl .r span:last-child{font-weight:600;text-align:right;}

  .f-table tbody tr{cursor:default;}
  .f-table tbody tr:hover{background:none;}
  .f-muted{color:var(--text-faint);}
  .f-parecer{font-size:13px;line-height:1.65;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;}

  .f-plano-row:last-child{border-bottom:none;}
  .f-plano-row .resp{color:var(--text-dim);}
  .f-map-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
  .f-map-head h3{margin:0;}
  .f-seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:8px;overflow:hidden;}
  .f-seg button{border:none;background:var(--panel);font-family:inherit;font-size:11.5px;font-weight:700;color:var(--text-dim);padding:5px 10px;cursor:pointer;}
  .f-seg button.on{background:var(--accent);color:#fff;}
  .f-map-wrap{position:relative;height:280px;border-radius:var(--radius);overflow:hidden;border:1px solid var(--border);}

  .f-photo .stamp{position:absolute;left:8px;bottom:8px;background:rgba(15,23,42,.7);color:#fff;font-size:11px;font-weight:600;padding:3px 8px;border-radius:6px;}

  /* fim das regras restauradas */

  :root{
    --bg:#F2F2F2;
    --panel:#FFFFFF;
    --border:#e2e8f0;
    --border-strong:#cbd5e1;
    --text:#1e2430;
    --text-dim:#64748b;
    --text-faint:#94a3b8;
    /* Paleta Recife Resiliente: #0869A6 · #2685BF · #5496BF · #FFFFFF · #F2F2F2 */
    --azul-1:#0869A6;
    --azul-2:#2685BF;
    --azul-3:#5496BF;
    /* Cor de destaque neutra: a cor forte fica reservada ao risco dos pontos no mapa */
    --accent:#334155;
    --accent-soft:#e2e8f0;
    --canal:#8b5cf6;
    --critico:#ef4444;
    --hidro:#7fb8e0;
    --status-obra:#8b5cf6;
    --status-obra-bg:#f1ebfe;
    --status-obra-text:#6d28d9;
    --status-licit:#d97706;
    --status-licit-bg:#fef3e2;
    --status-licit-text:#8a5108;
    --status-concl:#0f9d58;
    --status-concl-bg:#e6f6ec;
    --status-concl-text:#0b7a45;
    --shadow:0 1px 2px rgba(15,23,42,.04), 0 2px 8px rgba(15,23,42,.06);
    --shadow-lg:0 8px 24px rgba(15,23,42,.14);
    --radius:8px;
    --pc-lista-w:320px;   /* largura da lista de pontos críticos (direita) */

    /* saúde de cronograma (Página 2/3) — reaproveita as mesmas cores semânticas já definidas acima */
    --saudavel:var(--status-concl);
    --saudavel-bg:var(--status-concl-bg);
    --saudavel-text:var(--status-concl-text);
    --atencao:var(--status-licit);
    --atencao-bg:var(--status-licit-bg);
    --atencao-text:var(--status-licit-text);
    --critico-bg:#fde8e8;
    --critico-text:#b91c1c;
    --neutro:var(--text-faint);
    --neutro-bg:#f1f5f9;

    /* paleta categórica das 5 bacias (Art. 9º do PMDR) — distinta das cores de status acima */
    --b-paratibe:#2563eb;
    --b-beberibe:#9333ea;
    --b-capibaribe:var(--accent);
    --b-tejipio:#c2410c;
    --b-jaboatao:#be185d;

    /* rampa sequencial de severidade (1 hue, claro->escuro, a partir do accent) */
    --sev-1:#d7ece6;
    --sev-2:#8fcabd;
    --sev-3:#3c9782;
    --sev-4:#0a4f43;
  }

  /* ---------- TABS (novo) ---------- */
  .tabs{display:flex;gap:4px;flex:0 0 auto;align-self:stretch;}
  .tab{appearance:none;border:none;background:none;height:100%;padding:0 4px;display:flex;align-items:center;gap:7px;
    font-family:inherit;font-weight:600;font-size:13px;color:rgba(255,255,255,.65);border-bottom:2.5px solid transparent;
    cursor:pointer;white-space:nowrap;}
  .tab:hover{color:#FFFFFF;}
  .tab .tabnum{font-size:10.5px;font-weight:700;color:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.30);
    border-radius:5px;padding:1px 5px;}
  .tab[aria-selected="true"]{color:#FFFFFF;border-bottom-color:#FFFFFF;}
  .tab[aria-selected="true"] .tabnum{color:#FFFFFF;border-color:#FFFFFF;}

  .navbar-spacer{flex:1 1 auto;}
  .navbar-inst{flex:0 0 auto;font-size:12px;color:rgba(255,255,255,.65);font-weight:500;white-space:nowrap;}

  /* ---------- FILTROS + BUSCA (flutuantes, translúcidos, à direita dos KPIs) ---------- */
  .filter-float{display:flex;flex-direction:column;align-items:stretch;gap:8px;pointer-events:auto;flex:0 0 auto;}
  .filterbar{display:flex;flex-wrap:nowrap;align-items:center;gap:10px;flex:0 0 auto;white-space:nowrap;
    padding:10px 18px;border-radius:14px;
    background:rgba(255,255,255,.28);
    border:1px solid rgba(255,255,255,.40);
    box-shadow:0 4px 16px rgba(15,23,42,.10);
    backdrop-filter:blur(10px) saturate(160%);
    -webkit-backdrop-filter:blur(10px) saturate(160%);
  }
  .filterbar label{font-size:13px;font-weight:700;color:#3d4653;text-transform:uppercase;letter-spacing:.04em;}
  .filterbar select{height:38px;border-radius:8px;border:1px solid rgba(255,255,255,.40);background:rgba(255,255,255,.28);color:var(--text);
    font-family:inherit;font-size:14.5px;padding:0 10px;outline:none;}
  .filterbar select:focus{border-color:var(--accent);}
  .filterbar select:disabled{opacity:.5;}
  .filterbar .fcount{font-size:13.5px;color:var(--text-dim);font-variant-numeric:tabular-nums;white-space:nowrap;}
  .filterbar .freset{font-size:14px;font-weight:600;color:var(--text-dim);background:none;border:none;cursor:pointer;
    padding:4px 6px;border-radius:6px;white-space:nowrap;}
  .filterbar .freset:hover{background:rgba(255,255,255,.35);color:var(--text);}

  .search-box{width:auto;position:relative;flex:0 0 auto;}
  .search-box input{
    width:100%;height:44px;border-radius:999px;
    border:1px solid rgba(255,255,255,.40);background:rgba(255,255,255,.28);color:var(--text);
    padding:0 38px;font-size:15px;font-family:inherit;outline:none;text-align:center;
    backdrop-filter:blur(10px) saturate(160%);
    -webkit-backdrop-filter:blur(10px) saturate(160%);
    box-shadow:0 4px 16px rgba(15,23,42,.10);
    transition:border-color .15s, background .15s;
  }
  .search-box input::placeholder{color:var(--text-dim);text-align:center;}
  .search-box input:focus{border-color:var(--accent);background:rgba(255,255,255,.45);}
  .search-box svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--text-dim);pointer-events:none;}

  main{flex:1 1 auto;min-height:0;position:relative;}
  .page{display:none;height:100%;}
  .page.active{display:block;}

  /* ---------- OVERLAY (KPIs + lista) SOBRE O MAPA — Página 1 ---------- */
  .map-area{position:absolute;inset:0;}
  #viewDiv{position:absolute;inset:0;}

  .overlay-grid{
    position:absolute;inset:16px;z-index:15;
    display:grid;
    grid-template-columns:380px 1fr var(--pc-lista-w);
    grid-template-rows:auto 1fr;
    gap:10px;
    pointer-events:none;
  }
  .floating-panel{
    pointer-events:auto;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow:var(--shadow-lg);
  }
  .kpi-panel{grid-column:1 / -1;grid-row:1;display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;background:none;border:none;box-shadow:none;pointer-events:none;}
  .kpi-strip{display:flex;flex-wrap:nowrap;justify-content:flex-start;gap:12px;pointer-events:none;}
  .kpi-tile{
    pointer-events:auto;min-width:0;flex:0 0 auto;
    display:flex;flex-direction:column;gap:2px;
    padding:12px 22px;border-radius:14px;
    background:rgba(255,255,255,.28);
    border:1px solid rgba(255,255,255,.40);
    box-shadow:0 4px 16px rgba(15,23,42,.10);
    backdrop-filter:blur(10px) saturate(160%);
    -webkit-backdrop-filter:blur(10px) saturate(160%);
  }
  .kpi-label{font-size:12px;font-weight:700;color:#3d4653;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;}
  .kpi-value{font-size:28px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums;letter-spacing:-.01em;white-space:nowrap;}
  .kpi-value small{font-size:14px;font-weight:600;color:var(--text-dim);}

  .list-panel{
    grid-column:1;grid-row:2;min-height:0;padding:12px 2px 14px;display:flex;flex-direction:column;gap:10px;
    background:rgba(255,255,255,.28);
    border:1px solid rgba(255,255,255,.40);
    box-shadow:0 4px 16px rgba(15,23,42,.10);
    backdrop-filter:blur(10px) saturate(160%);
    -webkit-backdrop-filter:blur(10px) saturate(160%);
  }
  .list-panel-header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:0 12px;}
  .list-panel-header h3{margin:0;font-size:13px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;}
  .list-count{font-size:12px;color:var(--text-faint);font-variant-numeric:tabular-nums;white-space:nowrap;}

  /* Lista de pontos críticos (direita), no mesmo estilo da lista de intervenções */
  .list-panel.pc-panel{grid-column:3;}
  /* Recolher a lista de pontos críticos (14/10/2026): fica só o título */
  .pc-recolher{display:flex;align-items:center;justify-content:center;width:24px;height:24px;border:none;border-radius:6px;
               background:rgba(255,255,255,.55);color:#0869A6;cursor:pointer;padding:0;}
  .pc-recolher:hover{background:#fff;}
  .list-panel-header .pc-recolher{margin-left:auto;}
  .pc-recolher svg{transition:transform .2s;}
  .list-panel.recolhida{align-self:start;padding-bottom:12px;}
  .list-panel.recolhida .project-list{display:none;}
  .list-panel.recolhida .pc-recolher svg{transform:rotate(180deg);}
  .pc-card{
    border:1px solid rgba(255,255,255,.50);border-radius:var(--radius);padding:10px 12px;
    background:rgba(255,255,255,.12);cursor:pointer;transition:border-color .15s, box-shadow .15s, background .15s;
    display:flex;flex-direction:column;gap:5px;
  }
  .pc-card:hover{background:rgba(255,255,255,.28);border-color:rgba(255,255,255,.75);box-shadow:var(--shadow);}
  .pc-card.active{background:rgba(255,255,255,.32);border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .pc-card.sem-coord{cursor:default;opacity:.75;}
  .pc-card-top{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .pc-pos{font-size:11px;font-weight:700;color:#fff;background:#334155;border-radius:999px;padding:2px 8px;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .pc-indice{font-size:12px;color:var(--text-dim);white-space:nowrap;}
  .pc-indice b{font-size:15px;color:#1a1a1a;font-variant-numeric:tabular-nums;}
  .pc-trecho{font-size:13.5px;font-weight:600;color:#1a1a1a;line-height:1.3;}
  .pc-meta{font-size:12px;color:var(--text-dim);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;}
  .pc-tag{font-size:10.5px;font-weight:700;color:#334155;background:rgba(51,65,85,.10);border-radius:999px;padding:1px 7px;white-space:nowrap;}
  .pc-msg{color:var(--text-faint);font-size:12.5px;padding:10px 12px;}
  .project-list{display:flex;flex-direction:column;gap:8px;min-height:0;overflow-y:auto;padding-right:2px;scroll-behavior:smooth;}
  .project-card{
    border:1px solid rgba(255,255,255,.50);border-radius:var(--radius);padding:11px 12px;
    background:rgba(255,255,255,.12);
    cursor:pointer;transition:border-color .15s, box-shadow .15s, background .15s;
    display:flex;flex-direction:column;gap:6px;
  }
  .project-card:hover{background:rgba(255,255,255,.28);border-color:rgba(255,255,255,.75);box-shadow:var(--shadow);}
  .project-card.active{background:rgba(255,255,255,.32);border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .project-card-top{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .status-pill{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:3px 8px;border-radius:999px;white-space:nowrap;}
  /* Status das obras em tom neutro (sem cor), para não competir com o risco */
  .status-pill.obra,.status-pill.licitacao,.status-pill.concluido,.status-pill.nao_planejado,.status-pill.conceitual,.status-pill.projeto{background:rgba(51,65,85,.10);color:#334155;}
  .status-pill.saudavel{background:var(--saudavel-bg);color:var(--saudavel-text);}
  .status-pill.atencao{background:var(--atencao-bg);color:var(--atencao-text);}
  .status-pill.critico{background:var(--critico-bg);color:var(--critico-text);}
  .status-pill i{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block;margin-right:4px;}
  .project-code{font-size:11.5px;color:var(--text-faint);font-variant-numeric:tabular-nums;font-weight:600;}
  .project-title{font-size:14px;font-weight:600;color:#1a1a1a;line-height:1.35;}
  .project-meta{font-size:12.5px;color:var(--text-dim);}
  .project-meta b{color:var(--text-dim);font-weight:600;}
  .project-card-actions{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:2px;}
  .link-ficha{font-size:12px;font-weight:700;color:var(--accent);background:none;border:none;cursor:pointer;padding:2px 0;}
  .link-ficha:hover{text-decoration:underline;}
  .streetview-btn{
    font-size:11.5px;font-weight:700;color:var(--accent);background:var(--accent-soft);
    border:none;border-radius:6px;padding:4px 8px;cursor:pointer;
    display:inline-flex;align-items:center;gap:4px;white-space:nowrap;
  }
  .streetview-btn:hover{filter:brightness(.95);}

  /* ---------- CARD / POP-UP ENRIQUECIDO ---------- */
  .pbar{display:flex;align-items:center;gap:8px;}
  .pbar-track{flex:1;height:6px;border-radius:999px;background:rgba(15,23,42,.10);overflow:hidden;}
  .pbar-fill{height:100%;border-radius:999px;background:var(--accent);}
  .pbar-fill.atencao{background:var(--atencao);}
  .pbar-fill.critico{background:var(--critico);}
  .pbar-val{font-size:11px;font-weight:700;color:var(--text-dim);font-variant-numeric:tabular-nums;min-width:30px;text-align:right;}
  .pcard-line{font-size:12px;color:var(--text-dim);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;}
  .pcard-line b{color:#1a1a1a;font-weight:600;font-variant-numeric:tabular-nums;}
  .pill-row{display:flex;gap:6px;align-items:center;}
  .esri-popup__main-container{border-radius:12px !important;box-shadow:0 12px 32px rgba(15,23,42,.22) !important;border:1px solid var(--border);font-family:'Inter',system-ui,sans-serif;}
  .esri-popup__header{background:#fff;border-bottom:1px solid var(--border);}
  .esri-popup__header-title{font-size:14px !important;font-weight:700 !important;color:#0f172a !important;letter-spacing:-.01em;padding:12px 14px !important;}
  .esri-popup__header-buttons .esri-widget__heading, .esri-popup__button{color:var(--text-dim);}
  .esri-popup__content{margin:0 !important;}
  .esri-feature__main-container{padding:6px 14px 10px !important;}
  .esri-widget__table{border-collapse:collapse;width:100%;font-size:12.5px;}
  .esri-widget__table tr, .esri-widget__table tr:nth-child(odd), .esri-widget__table tr:nth-child(even){background:transparent !important;}
  .esri-widget__table th, .esri-widget__table td{padding:8px 0 !important;border:none !important;border-bottom:1px solid #f1f5f9 !important;vertical-align:top;}
  .esri-widget__table tr:last-child th, .esri-widget__table tr:last-child td{border-bottom:none !important;}
  .esri-widget__table th{width:42%;font-size:11px !important;font-weight:600 !important;letter-spacing:.03em;text-transform:uppercase;color:#64748b !important;padding-right:12px !important;text-align:left;}
  .esri-widget__table td{font-weight:600;color:#0f172a;text-align:right;word-break:break-word;}
  .esri-popup__footer{border-top:1px solid var(--border);}
  .esri-popup__action{font-size:12px !important;font-weight:600;color:var(--accent) !important;}
  /* Popup dos pontos críticos — ficha no estilo do Plano de Ações de SP */
  .rr-card{position:absolute;z-index:30;display:none;width:min(380px, calc(100% - 16px));}
  .rr-card-in{position:relative;z-index:1;display:flex;flex-direction:column;overflow:hidden;background:rgba(255,255,255,.45);border-radius:12px;
              backdrop-filter:blur(10px) saturate(160%);-webkit-backdrop-filter:blur(10px) saturate(160%);
              border:1px solid rgba(255,255,255,.60);box-shadow:0 12px 32px rgba(15,23,42,.22);font-family:'Inter',system-ui,sans-serif;}
  .rr-card-cab{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border);
               font-size:13px;font-weight:700;color:#0f172a;}
  .rr-card-x{border:none;background:none;font-size:20px;line-height:1;color:#64748b;cursor:pointer;padding:0 2px;}
  .rr-card-corpo{padding:10px 14px;overflow:auto;}
  .rr-card-acoes{display:flex;gap:8px;padding:8px 14px;border-top:1px solid var(--border);}
  .rr-card-acoes button{border:1px solid rgba(255,255,255,.70);background:rgba(255,255,255,.55);color:#334155;font-weight:600;font-size:12px;
                        border-radius:6px;padding:5px 10px;cursor:pointer;}
  .rr-card-acoes button:hover{background:rgba(255,255,255,.85);}
  .rr-card-seta{position:absolute;z-index:0;left:-7px;width:14px;height:14px;background:rgba(255,255,255,.45);border-left:1px solid rgba(255,255,255,.60);
                border-bottom:1px solid var(--border);transform:translateY(-50%) rotate(45deg);}
  .rr-card.lado-esq .rr-card-seta{left:auto;right:-7px;border:none;border-right:1px solid var(--border);border-top:1px solid var(--border);}
  .rr-pop{--rr:#334155;--rr-2:#64748b;--rr-3:#94a3b8;--rr-cinza:rgba(242,242,242,.45);font-size:12.5px;line-height:1.45;color:#1f2937;}
  .rr-titulo{border-left:4px solid var(--rr-3);padding-left:8px;font-size:14px;font-weight:800;text-transform:uppercase;letter-spacing:.01em;color:var(--rr);line-height:1.25;}
  .rr-fatos{margin:12px 0;display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .rr-kpi{background:var(--rr-cinza);border-top:4px solid var(--rr-2);border-radius:8px;padding:6px 8px;text-align:center;}
  .rr-kpi-v{font-size:22px;font-weight:800;color:var(--rr);line-height:1.1;}
  .rr-kpi-r{font-size:11.5px;font-weight:700;color:#111827;margin-top:2px;}
  .rr-kpi-n{font-size:10.5px;color:#6b7280;}
  .rr-tab{width:100%;border-collapse:separate;border-spacing:0 2px;}
  .rr-tab th{background:var(--rr);color:#fff;font-size:10.5px;font-weight:600;text-align:left;padding:5px 8px;}
  .rr-tab th:first-child{border-radius:6px 0 0 6px;} .rr-tab th:last-child{border-radius:0 6px 6px 0;text-align:center;width:78px;line-height:1.2;}
  .rr-tab td{padding:4px 8px;font-size:12px;}
  .rr-tab td:last-child{text-align:center;}
  .rr-tab tr.rr-dim td{font-weight:700;color:#111827;padding-top:6px;}
  .rr-tab tr.rr-dim td{background:var(--rr-cinza);}
  .rr-tab tr.rr-subl td{background:rgba(255,255,255,.18);border-bottom:1px solid rgba(255,255,255,.55);}
  .rr-tab tr td:first-child{border-radius:4px 0 0 4px;} .rr-tab tr td:last-child{border-radius:0 4px 4px 0;}
  .rr-ini{display:inline-block;width:18px;height:18px;line-height:18px;border-radius:50%;background:var(--rr-2);color:#fff;
          font-size:10px;font-weight:700;text-align:center;margin-right:6px;}
  .rr-tab tr.rr-subl td:first-child{padding-left:46px;color:#374151;}
  /* Variáveis recolhidos por padrão; clicar na dimensão expande */
  .rr-tab tr.rr-subl{display:none;}
  .rr-tab tr.rr-subl.aberto{display:table-row;}
  .rr-tab tr.rr-dim{cursor:pointer;}
  .rr-tab tr.rr-dim:hover td{background:rgba(226,232,240,.85);}
  .rr-seta{display:inline-block;width:12px;margin-right:2px;color:#64748b;font-size:10px;transition:transform .15s;}
  .rr-tab tr.rr-dim.aberto .rr-seta{transform:rotate(90deg);}
  .rr-th-n{font-weight:400;font-size:9.5px;opacity:.85;}
  .rr-pe{margin-top:10px;font-size:10.5px;color:#9ca3af;}
  .rr-obras{margin:10px 0 4px;}
  .rr-obras-t{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#64748b;margin-bottom:4px;}
  .rr-obras-vazio{font-size:11px;color:#9ca3af;}
  .rr-obra{display:flex;justify-content:space-between;gap:8px;padding:5px 8px;margin-bottom:3px;border-radius:6px;
           background:rgba(255,255,255,.35);border:1px solid rgba(226,232,240,.9);font-size:12px;cursor:pointer;}
  .rr-obra:hover{background:rgba(226,232,240,.85);}
  .rr-obra-n{font-weight:600;color:#1e2430;}
  .rr-obra-s{color:#64748b;white-space:nowrap;}
  .rr-pe a{color:var(--rr);font-weight:600;}

  /* ---------- Legenda e Camadas (05/10/2026) ---------- */
  #layerPanel{width:272px;padding:0;overflow:hidden;}
  #layerPanel .lg-head{display:flex;align-items:center;justify-content:space-between;padding:11px 14px 9px;border-bottom:1px solid var(--border);cursor:pointer;user-select:none;}
  #layerPanel .lg-head h4{margin:0;}
  #layerPanel .lg-head .lg-min{border:none;background:transparent;color:var(--text-dim);font-size:13px;line-height:1;cursor:pointer;padding:2px 4px;border-radius:6px;}
  #layerPanel .lg-head .lg-min:hover{background:var(--bg);color:var(--text);}
  #layerPanel.min .lg-head{border-bottom:none;}
  #layerPanel.min #layerToggleList{display:none;}
  #layerToggleList{max-height:38vh;overflow-y:auto;padding:6px 6px 8px;}
  .lg-item{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:8px;font-size:11.5px;color:var(--text);line-height:1.25;}
  .lg-item:hover{background:rgba(15,23,42,.045);}
  .lg-item.off{opacity:.45;}
  .lg-item .lg-chev{flex:none;width:14px;height:14px;display:inline-flex;align-items:center;justify-content:center;color:var(--text-faint);transition:transform .15s;cursor:pointer;}
  .lg-item .lg-chev.open{transform:rotate(90deg);}
  .lg-item .lg-chev.empty{visibility:hidden;}
  .lg-item .lg-sw{flex:none;width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;}
  .lg-item .lg-sw svg,.lg-item .lg-sw img{max-width:18px;max-height:18px;}
  .lg-item .lg-name{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;}
  .lg-item.grp .lg-name{font-weight:700;font-size:12px;color:var(--text);}
  .lg-item .lg-eye{flex:none;border:none;background:transparent;padding:2px;border-radius:6px;color:var(--text-dim);cursor:pointer;display:inline-flex;}
  .lg-item .lg-eye:hover{background:var(--bg);color:var(--text);}
  .lg-kids{margin-left:15px;padding-left:6px;border-left:1px solid var(--border);}
  .lg-classes{margin:0 0 4px 37px;}
  .lg-class{display:flex;align-items:center;gap:7px;font-size:10.5px;color:var(--text-dim);padding:2px 0;}
  .lg-class .lg-sw{flex:none;width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;}
  .lg-sep{height:1px;background:var(--border);margin:5px 8px;}

  /* ---------- Escala compacta da página 1 (05/10/2026): KPIs, filtros, busca e lista menores ---------- */
  .overlay-grid{inset:12px;grid-template-columns:320px 1fr var(--pc-lista-w);gap:8px;}
  /* Mapa base e Camadas lado a lado, embaixo, entre a lista de intervenções e a de pontos (16/10/2026).
     Esquerda = margem 12 + lista 320 + 2 × 8 de folga. A lista de camadas abre para cima, com rolagem. */
  .map-br-stack{left:348px;right:calc(20px + var(--pc-lista-w));bottom:12px;flex-direction:row;justify-content:center;align-items:flex-end;pointer-events:none;}
  .map-br-stack > *{pointer-events:auto;}
  #layerPanel{width:auto;max-width:100%;min-width:0;}
  .map-br-stack{flex-wrap:nowrap;}
  .map-br-stack > #layerPanel{flex:0 1 auto;min-width:0;}
  .map-br-stack > #mapTools{flex:none;}
  /* Mapa base: de novo em várias linhas (16/10/2026, pedido de Pedro), recolhível pelo "–" do título */
